var CACHE = {};
function build(id) {
  if (CACHE[id]) return CACHE[id];
  var rows = SPR[id] || SPR.hero_down;
  var d = {}, keys = [];
  rows.forEach(function (row, y) {
    var full = row.length === 8 ? row + row.split('').reverse().join('') : row;
    var x = 0;
    while (x < 16) {
      var ch = full.charAt(x), n = 1;
      while (x + n < 16 && full.charAt(x + n) === ch) n++;
      if (ch && ch !== '.' && PAL[ch]) {
        if (!d[ch]) { d[ch] = ''; keys.push(ch); }
        d[ch] += 'M' + x + ' ' + y + 'h' + n + 'v1h-' + n + 'z';
      }
      x += n;
    }
  });
  var out = {};
  for (var i = 0; i < 12; i++) {
    var ch = keys[i];
    out['p' + i] = ch ? { fill: PAL[ch], d: d[ch] } : { fill: 'none', d: 'M0 0' };
  }
  CACHE[id] = out;
  return out;
}
class Component extends DCLogic {
  renderVals() {
    var paths = build(this.props.sprite ?? 'hero_down');
    var vals = Object.assign({}, paths);
    vals.size = this.props.size ?? 64;
    vals.tf = this.props.flip ? 'translate(16 0) scale(-1 1)' : '';
    return vals;
  }
}
