<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Algoria · Encuentro con Lía</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Pixelify+Sans:wght@400;600&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1e1b33}
a{color:#1c1a2b}
.px{font-family:'Press Start 2P',monospace}
.box{background:#fbf7ea;border:4px solid #1c1a2b;box-shadow:inset 0 0 0 4px #fbf7ea,inset 0 0 0 7px #1c1a2b;clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.bob{animation:bob 1s steps(2,end) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.choice{display:flex;align-items:center;gap:10px;font-family:'Press Start 2P',monospace;font-size:12px;color:#1c1a2b;text-decoration:none;padding:12px 14px;min-height:44px;box-sizing:border-box;border:4px solid #1c1a2b;background:#fbf7ea}
.choice:hover{background:#f6c945}
</style>
</helmet>
<div style="font-family: 'Pixelify Sans', sans-serif; color: #1c1a2b; background: #1e1b33; min-height: 820px; display: flex; justify-content: center; padding: 24px; box-sizing: border-box">
  <div style="width: 100%; max-width: 1100px; display: flex; flex-direction: column; border: 4px solid #1c1a2b; box-shadow: 0 0 0 4px #fbf7ea, 0 0 0 8px #1c1a2b; margin: 8px">

    <div style="position: relative; height: 440px; background: #7fd3e8; overflow: hidden">
      <div aria-hidden="true">
        <span style="position: absolute; left: 8%; top: 40px; width: 96px; height: 24px; background: #fbf7ea; box-shadow: 16px -12px 0 #fbf7ea, 40px -12px 0 #fbf7ea"></span>
        <span style="position: absolute; left: 58%; top: 70px; width: 120px; height: 24px; background: #fbf7ea; box-shadow: 24px -12px 0 #fbf7ea, 56px -12px 0 #fbf7ea"></span>
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: #6cc04a; border-top: 4px solid #2f7a3a"></div>
        <div style="position: absolute; left: 0; right: 0; bottom: 170px; height: 40px; background: #2f7a3a"></div>
      </div>

      <div class="box" style="position: absolute; left: 24px; top: 24px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 300px">
        <div style="display: flex; justify-content: space-between; gap: 20px; align-items: baseline"><strong class="px" style="font-size: 14px">LÍA</strong><span class="px" style="font-size: 11px">Nv 5</span></div>
        <span style="font-size: 18px">Guardiana de las decisiones</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <span class="px" style="font-size: 9px; background: #1c1a2b; color: #f6c945; padding: 5px 7px">TEMA: IF / ELSE</span>
          <span class="px" style="font-size: 9px; background: #6cc04a; border: 2px solid #1c1a2b; padding: 3px 6px">FÁCIL</span>
        </div>
      </div>

      <div style="position: absolute; right: 12%; top: 120px; display: flex; flex-direction: column; align-items: center">
        <div class="bob"><dc-import name="Sprite" sprite="lia" size="176" hint-size="176px,176px"></dc-import></div>
        <div aria-hidden="true" style="width: 240px; height: 40px; margin-top: -26px; border-radius: 50%; background: #2f7a3a; border: 4px solid #1c1a2b"></div>
      </div>

      <div style="position: absolute; left: 10%; bottom: 8px; display: flex; align-items: flex-end; gap: 0">
        <div style="display: flex; flex-direction: column; align-items: center">
          <dc-import name="Sprite" sprite="hero_up" size="192" hint-size="192px,192px"></dc-import>
        </div>
        <div style="margin-left: -24px; margin-bottom: 4px"><dc-import name="Sprite" sprite="pyxi" size="96" hint-size="96px,96px"></dc-import></div>
      </div>

      <div class="box" style="position: absolute; right: 24px; bottom: 24px; padding: 12px 16px; display: flex; gap: 10px; align-items: center; max-width: 300px">
        <dc-import name="Sprite" sprite="pyxi" size="36" hint-size="36px,36px"></dc-import>
        <span style="font-size: 17px; line-height: 1.25">Pyxi susurra: «Lía siempre pregunta por la sangría.»</span>
      </div>
    </div>

    <div style="background: #1e1b33; padding: 20px; border-top: 4px solid #1c1a2b">
      <div class="box" style="padding: 26px 30px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 180px; box-sizing: border-box; position: relative">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <strong class="px" style="font-size: 11px; color: #9c2b2b">LÍA</strong>
          <span class="px" style="font-size: 9px; color: #4a4560">{{counter}}</span>
        </div>
        <p role="status" style="margin: 0; font-size: 28px; line-height: 1.35; flex: 1">{{line}}</p>

        <sc-if value="{{showNext}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; justify-content: flex-end">
            <button type="button" onClick="{{next}}" class="px" style="font-size: 11px; display: flex; align-items: center; gap: 10px; background: transparent; border: 0; cursor: pointer; color: #1c1a2b; min-height: 44px; padding: 0 8px">SIGUIENTE <span class="blink" style="color: #e0483e; font-size: 16px">▼</span></button>
          </div>
        </sc-if>

        <sc-if value="{{showChoices}}" hint-placeholder-val="{{false}}">
          <nav aria-label="Responder a Lía" style="display: flex; flex-wrap: wrap; gap: 12px">
            <a class="choice" href="Lesson.dc.html"><span style="color: #e0483e">▸</span>¡ENSÉÑAME!</a>
            <a class="choice" href="Battle.dc.html">YA LO SÉ: ¡AL DUELO!</a>
            <a class="choice" href="Map.dc.html">AHORA NO</a>
            <button type="button" class="choice" onClick="{{restart}}" style="cursor: pointer; background: #c3c7d4">REPETIR</button>
          </nav>
        </sc-if>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
var LINES = [
  '¡Hola, viajero! Soy Lía. Por este camino todos llegan a una bifurcación.',
  'En programación pasa lo mismo: a veces tu código tiene que elegir qué hacer.',
  'Para eso existe if. Si algo es verdadero, haces una cosa. Si no (else), haces otra.',
  'Te propongo un trato: te lo enseño en 3 minutos y luego me ganas un duelo. ¿Hecho?'
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    var self = this, i = this.state.i, last = i === LINES.length - 1;
    return {
      line: LINES[i],
      counter: (i + 1) + ' / ' + LINES.length,
      showNext: !last,
      showChoices: last,
      next: function () { self.setState({ i: Math.min(i + 1, LINES.length - 1) }); },
      restart: function () { self.setState({ i: 0 }); }
    };
  }
}
</script>
</body>
</html>
